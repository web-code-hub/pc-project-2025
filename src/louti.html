<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楼梯式导航</title>
  <style>
    body {
      margin: 0;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 1226px;
      margin: 0 auto;
    }

    header {
      height: 140px;
      background-color: burlywood;
    }

    .page1 {
      height: 460px;
      background-color: aqua;
    }

    .page2 {
      height: 403px;
      background-color: rgb(36, 236, 36);
    }

    .page3 {
      height: 860px;
      background-color: rgb(41, 23, 202);
    }

    .page4 {
      height: 638px;
      background-color: rgb(197, 23, 32);
    }

    .page5 {
      height: 773px;
      background-color: rgb(241, 109, 33);
    }

    .page6 {
      height: 409px;
      background-color: rgb(64, 19, 75);
    }

    .page7 {
      height: 527px;
      background-color: rgb(20, 153, 124);
    }

    .staircase {
      position: fixed;
      left: 10px;
      top: 200px;
    }

    .staircase ul li {
      height: 40px;
      line-height: 40px;
      font-size: 14px;
      border-left: 2px solid rgb(170, 170, 170);
      color: #a8a7a7;
      padding-left: 10px;
      cursor: pointer;
    }

    .staircase ul li.selected {
      border-color: orange;
      color: orange;
    }

    footer {
      height: 354px;
      background-color: skyblue;
    }
  </style>
</head>

<body>
  <header></header>
  <main>
    <div class="page1 container staircase-content">轮播图</div>
    <div class="page2 container staircase-content">歌单推荐</div>
    <div class="page3 container staircase-content">家具推荐</div>
    <div class="page4 container staircase-content">精彩视频</div>
    <div class="page5 container staircase-content">推荐信息</div>
    <div class="page6 container staircase-content">手风琴</div>
    <div class="page7 container staircase-content">拖拽画廊</div>
    <nav class="staircase">
      <ul>
        <li class="selected">轮播图</li>
        <li>歌单推荐</li>
        <li>家具推荐</li>
        <li>精彩视频</li>
        <li>推荐信息</li>
        <li>手风琴</li>
        <li>拖拽画廊</li>
      </ul>
    </nav>
  </main>
  <footer></footer>
  <script>
    const $ = function (selector) {
      return document.querySelectorAll(selector)
    }
    const dom = {
      list: $('.staircase ul li'),
      contentList: $('.staircase-content')
    }
    let currentIndex = 0
    const scrollTops = []
    for (let i = 0; i < dom.contentList.length; i++) {
      scrollTops.push(dom.contentList[i].offsetTop)
    }
    scrollTops.push(Infinity)

    for (let i = 0; i < dom.list.length; i++) {
      dom.list[i].addEventListener('click', function () {
        dom.list[currentIndex].classList.remove('selected')
        dom.list[i].classList.add('selected')
        currentIndex = i
        window.scrollTo({
          left: 0,
          top: scrollTops[i],
          behavior: 'smooth'
        })
      })
    }
    document.addEventListener('scroll', function () {
      const scrollTop = window.scrollY
      // let newIndex = 0
      // for (let i = 0; i < scrollTops.length; i++) {
      //   if (i === scrollTops.length - 1 || scrollTops[i + 1] > scrollTop) {
      //     newIndex = i
      //     break;
      //   }
      // }
      // if (newIndex !== currentIndex) {
      //   dom.list[currentIndex].classList.remove('selected')
      //   dom.list[newIndex].classList.add('selected')
      //   currentIndex = newIndex
      // }
      for (let i = 0; i < scrollTops.length; i++) {
        let k = i - 1 < 0 ? 0 : i - 1
        if (scrollTops[i] >= scrollTop + dom.contentList[k].clientHeight / 3) {
          dom.list[currentIndex].classList.remove('selected')
          dom.list[k].classList.add('selected')
          currentIndex = k
          return;
        }
      }
    })
  </script>
</body>

</html>
